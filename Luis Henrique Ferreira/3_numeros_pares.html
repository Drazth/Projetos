<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números Pares</title>
    <script>
        function mostrarNumerosPares() {
            let numero;
            do {
                numero = parseInt(prompt("Digite um numero (não pode ser menor que 0):"));
                if (numero < 0) {
                    alert("numero invalido! Por favor, digite um numero maior ou igual a 0.");
                }
            } while (numero < 0);

            let pares = [];
            let soma = 0;

            for (let i = 1; i <= numero; i++) {
                if (i % 2 === 0) {
                    pares.push(i);
                    soma += i;
                }
            }

            alert(`Você digitou o numero ${numero}.\n` +
                  `Numeros pares: ${pares.join(", ")}.\n` +
                  `Quantidade de pares: ${pares.length} números.\n` +
                  `Soma dos pares: ${soma}.`);
        }
    </script>
</head>
<body>
    <h1>3- Usando Java Script, solicite um número em uma caixa prompt, este número não pode ser menor que 0, se for mostrar uma caixa de alerta para repetir o número.</h1>
    <button onclick="mostrarNumerosPares()">Clique aqui para inserir um numero</button>
</body>
</html>
